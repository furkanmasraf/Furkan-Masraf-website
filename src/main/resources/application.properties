
spring.application.name=Furkan Masraf Portfolio API
server.port=8080

# Primary Database: H2 In-Memory with PostgreSQL compatibility mode for instant zero-config startup
spring.datasource.url=jdbc:h2:mem:furkan_portfolio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# PostgreSQL Production settings (uncomment when running dedicated PostgreSQL server):
# spring.datasource.url=jdbc:postgresql://localhost:5432/furkan_portfolio
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Custom Logging
logging.level.com.furkanmasraf.portfolio=INFO
